<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "PS2P"; src: url("assets/fonts/press-start-2p-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "SS"; src: url("assets/fonts/silkscreen-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "SG"; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    position: relative;
    width: 1200px; height: 630px;
    background:
      radial-gradient(60% 60% at 82% 30%, rgba(122, 60, 255, .35), transparent 65%),
      radial-gradient(45% 45% at 12% 88%, rgba(53, 198, 255, .2), transparent 70%),
      linear-gradient(160deg, #0a0f34 0%, #05061a 55%, #070a24 100%);
    font-family: "SG", sans-serif;
    color: #eef3ff;
    overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(126,154,235,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(126,154,235,.07) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .frame { position: absolute; inset: 22px; border: 3px solid rgba(126,154,235,.4); }
  .frame::before, .frame::after {
    content: ""; position: absolute; width: 40px; height: 40px; border: 4px solid #ffc21a;
  }
  .frame::before { left: -3px; top: -3px; border-right: 0; border-bottom: 0; }
  .frame::after { right: -3px; bottom: -3px; border-left: 0; border-top: 0; }
  .copy { position: absolute; left: 74px; top: 92px; width: 600px; }
  .kicker {
    font-family: "SS"; font-size: 14px; letter-spacing: .2em; color: #8fe3ff; text-transform: uppercase;
    display: flex; align-items: center; gap: 12px;
  }
  .kicker i { width: 10px; height: 10px; background: #ffc21a; }
  h1 {
    font-family: "PS2P"; font-size: 46px; line-height: 1.22; margin-top: 28px;
    text-shadow: 0 6px 0 rgba(3,5,18,.9);
  }
  h1 span { color: #ffc21a; display: block; }
  h1 em { font-style: normal; display: block; font-size: .68em; letter-spacing: .1em; }
  .sub { margin-top: 24px; font-size: 21px; color: #9aa8cf; line-height: 1.5; width: 520px; }
  .chips { display: flex; gap: 12px; margin-top: 26px; }
  .chips img { width: 52px; height: 52px; image-rendering: pixelated; }
  .mascot { position: absolute; right: 24px; bottom: 6px; width: 445px; image-rendering: pixelated; filter: drop-shadow(0 0 60px rgba(255,194,26,.35)); }
  .badge {
    position: absolute; right: 86px; top: 78px;
    font-family: "PS2P"; font-size: 13px; color: #241a00; background: #ffc21a;
    padding: 12px 16px; border: 3px solid #ffe89a;
  }
  .foot {
    position: absolute; left: 74px; bottom: 40px;
    font-family: "SS"; font-size: 13px; letter-spacing: .16em; color: #8b98c4; text-transform: uppercase; white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="frame"></div>
    <div class="badge">LEVEL 99</div>
    <div class="copy">
      <p class="kicker"><i></i> Mongol Aspiration International School</p>
      <h1>MAIS<span>Physics &amp; Astronomy</span><em>Club</em></h1>
      <p class="sub">Physics · Astronomy · Astrophysics · Cosmology · Maths · Machine Learning · AI · CS</p>
      <div class="chips">
        <img src="assets/img/topics/physics.png" alt="">
        <img src="assets/img/topics/astronomy.png" alt="">
        <img src="assets/img/topics/cosmology.png" alt="">
        <img src="assets/img/topics/math.png" alt="">
        <img src="assets/img/topics/ml.png" alt="">
        <img src="assets/img/topics/ai.png" alt="">
        <img src="assets/img/topics/cs.png" alt="">
      </div>
      <p class="foot">mais-pac.github.io · Ulaanbaatar, Mongolia</p>
    </div>
    <img class="mascot" src="assets/img/mascot.png" alt="">
  </div>
</body>
</html>
